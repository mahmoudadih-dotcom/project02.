
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Colors & Opacity</title>
</head>

<body>
    <h1>Colors & Opacity</h1>

    <h2>Named Colors</h2>
    <div class="named-red">Red</div>
    <div class="named-blue">Blue</div>
    <div class="named-green">Green</div>

    <h2>HEX Colors</h2>
    <div class="hex-red">HEX: #ff0000</div>
    <div class="hex-blue">HEX: #0000ff</div>
    <div class="hex-green">HEX: #00ff00</div>

    <h2>RGB Colors</h2>
    <div class="rgb-red">RGB: 255, 0, 0</div>
    <div class="rgb-blue">RGB: 0, 0, 255</div>
    <div class="rgb-green">RGB: 0, 255, 0</div>

    <h2>RGBA Colors</h2>
    <div class="rgba-red">Red with transparency</div>
    <div class="rgba-blue">Blue with transparency</div>
    <div class="rgba-green">Green with transparency</div>

    <h2>Opacity vs RGBA</h2>

    <div class="opacity-box">
        <span>Opacity: 0.5</span>
    </div>

    <div class="rgba-box">
        <span>RGBA background: 0.5</span>
    </div>
</body>

</html>
